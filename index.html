<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.json">
<title>Lærðu Íslensku</title>
<style>
:root{--blue:#0b3d91;--light:#f3f7fc;--green:#198754;--red:#dc3545;--text:#172033}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:var(--text)}
header{background:linear-gradient(135deg,#0b3d91,#1558c0);color:#fff;padding:24px 18px 28px;border-radius:0 0 24px 24px}
header h1{margin:0 0 6px;font-size:28px}header p{margin:0;opacity:.9}
main{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #00000010}
.progress{height:10px;background:#e5eaf2;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#198754;width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
button.secondary{background:#e8eef8;color:var(--blue)}button.green{background:var(--green)}button.red{background:var(--red)}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px}
.icelandic{font-size:27px;font-weight:800}.translation{font-size:17px;color:#5b6575;margin-top:5px}
.small{font-size:13px;color:#687386}.hidden{display:none}.back{margin-bottom:8px}
.quiz-option{display:block;width:100%;margin:9px 0;text-align:left;background:#edf2fa;color:#18243a}
.quiz-option.correct{background:#198754;color:#fff}.quiz-option.wrong{background:#dc3545;color:#fff}
nav{position:sticky;bottom:10px;background:#fff;border-radius:18px;padding:8px;box-shadow:0 3px 18px #0002;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
nav button{padding:10px;font-size:13px}.badge{display:inline-block;background:#fff3cd;color:#765900;border-radius:20px;padding:6px 10px;font-size:13px;font-weight:bold}
footer{text-align:center;color:#7b8494;padding:20px;font-size:12px}
@media(max-width:500px){.grid{grid-template-columns:1fr}.icelandic{font-size:24px}}
</style>
</head>
<body>
<header><h1>🇮🇸 Lærðu Íslensku</h1><p>Aprenda islandês de forma simples e prática</p></header>
<main>
<section id="home">
<div class="card"><b>Seu progresso</b><p><span id="points">0</span> pontos · <span id="completed">0</span>/10 aulas</p><div class="progress"><div id="bar"></div></div></div>
<div class="grid">
<button onclick="showLessons()">📚 Aulas</button>
<button onclick="startRandomQuiz()">🧠 Quiz</button>
<button onclick="showPhrases()">🗣️ Frases</button>
<button onclick="showProgress()">⭐ Progresso</button>
</div>
<div class="card"><span class="badge">COMECE AQUI</span><h2>Aula 1 — Cumprimentos</h2><p>Aprenda as primeiras palavras e frases para usar na Islândia.</p><button class="green" onclick="openLesson(0)">Começar</button></div>
</section>

<section id="content" class="hidden"></section>
<footer>Lærðu Íslensku · versão inicial gratuita</footer>
<nav>
<button onclick="goHome()">🏠 Início</button><button onclick="showLessons()">📚 Aulas</button><button onclick="showProgress()">⭐ Progresso</button>
</nav>
</main>
<script>
const lessons=[
["Cumprimentos",[["Halló","Olá"],["Góðan daginn","Bom dia"],["Gott kvöld","Boa noite"],["Takk","Obrigado/a"],["Já","Sim"],["Nei","Não"],["Bless","Adeus"],["Sjáumst","Até logo"]]],
["Apresentação",[["Hvað heitir þú?","Como você se chama?"],["Ég heiti Carlos.","Eu me chamo Carlos."],["Hvaðan ertu?","De onde você é?"],["Ég er frá Portúgal.","Sou de Portugal."],["Hvernig hefurðu það?","Como você está?"],["Ég hef það gott.","Estou bem."]]],
["Números",[["Einn","Um"],["Tveir","Dois"],["Þrír","Três"],["Fjórir","Quatro"],["Fimm","Cinco"],["Sex","Seis"],["Sjö","Sete"],["Átta","Oito"],["Níu","Nove"],["Tíu","Dez"]]],
["Família",[["Fjölskylda","Família"],["Maki","Cônjuge"],["Eiginkona","Esposa"],["Eiginmaður","Marido"],["Barn","Criança"],["Sonur","Filho"],["Dóttir","Filha"],["Foreldrar","Pais"]]],
["Casa",[["Hús","Casa"],["Íbúð","Apartamento"],["Herbergi","Quarto"],["Eldhús","Cozinha"],["Baðherbergi","Casa de banho"],["Hurð","Porta"],["Gluggi","Janela"]]],
["Compras",[["Hvað kostar þetta?","Quanto custa isto?"],["Ég vil þetta.","Quero isto."],["Get ég borgað með korti?","Posso pagar com cartão?"],["Kvittun, takk.","Recibo, por favor."],["Dýrt","Caro"],["Ódýrt","Barato"]]],
["Comida",[["Matur","Comida"],["Vatn","Água"],["Kaffi","Café"],["Mjólk","Leite"],["Brauð","Pão"],["Kjöt","Carne"],["Fiskur","Peixe"],["Ég er svangur.","Estou com fome."]]],
["Transporte",[["Strætó","Autocarro"],["Bíll","Carro"],["Hvar er stoppistöðin?","Onde fica a paragem?"],["Hvenær kemur strætó?","Quando chega o autocarro?"],["Vinstri","Esquerda"],["Hægri","Direita"],["Beint áfram","Sempre em frente"]]],
["Trabalho",[["Vinna","Trabalho"],["Vinna","Trabalhar"],["Stjóri","Chefe"],["Samstarfsmaður","Colega de trabalho"],["Ég er að vinna.","Estou a trabalhar."],["Ég kem klukkan sex.","Venho às seis."],["Takk fyrir hjálpina.","Obrigado/a pela ajuda."]]],
["Conversação básica",[["Fyrirgefðu","Desculpe"],["Geturðu hjálpað mér?","Pode ajudar-me?"],["Ég skil ekki.","Não entendo."],["Geturðu talað hægar?","Pode falar mais devagar?"],["Hvað þýðir þetta?","O que significa isto?"],["Allt í lagi.","Está tudo bem."],["Góða nótt","Boa noite"]]]
];
let state=JSON.parse(localStorage.getItem("laerduState")||'{"points":0,"completed":[],"seen":0}');
function save(){localStorage.setItem("laerduState",JSON.stringify(state));update()}
function update(){document.getElementById("points").textContent=state.points;document.getElementById("completed").textContent=state.completed.length;document.getElementById("bar").style.width=(state.completed.length*10)+"%"}
function speak(t){if(!("speechSynthesis"in window)){alert("O seu dispositivo não disponibiliza leitura de voz neste navegador.");return}let u=new SpeechSynthesisUtterance(t);u.lang="is-IS";u.rate=.78;speechSynthesis.cancel();speechSynthesis.speak(u)}
function hideHome(){document.getElementById("home").classList.add("hidden");document.getElementById("content").classList.remove("hidden")}
function goHome(){document.getElementById("content").classList.add("hidden");document.getElementById("home").classList.remove("hidden");update()}
function showLessons(){hideHome();let h="<div class='card'><button class='secondary back' onclick='goHome()'>← Voltar</button><h2>📚 Aulas</h2>";lessons.forEach((l,i)=>{let done=state.completed.includes(i)?"✅ ":"";h+=`<div class="card lesson"><div><b>${done}Aula ${i+1}</b><div class="small">${l[0]} · ${l[1].length} palavras/frases</div></div><button onclick="openLesson(${i})">Abrir</button></div>`});h+="</div>";document.getElementById("content").innerHTML=h}
function openLesson(i){hideHome();let l=lessons[i];let h=`<div class="card"><button class="secondary back" onclick="showLessons()">← Aulas</button><h2>Aula ${i+1}: ${l[0]}</h2><p class="small">Toque em 🔊 para ouvir.</p>`;l[1].forEach(x=>{h+=`<div class="card"><div class="icelandic">${x[0]}</div><div class="translation">${x[1]}</div><button class="secondary" style="margin-top:10px" onclick="speak(${JSON.stringify(x[0])})">🔊 Ouvir</button></div>`});h+=`<button class="green" onclick="quiz(${i})">🧠 Fazer quiz desta aula</button></div>`;document.getElementById("content").innerHTML=h}
function quiz(i){hideHome();let qs=lessons[i][1].slice(0,5).sort(()=>Math.random()-.5), n=0, score=0;function render(){if(n>=qs.length){if(!state.completed.includes(i))state.completed.push(i);state.points+=score;save();document.getElementById("content").innerHTML=`<div class='card'><h2>🎉 Aula concluída!</h2><p>Você acertou <b>${score/10}/${qs.length}</b>.</p><p>Ganhou <b>${score} pontos</b>.</p><button class='green' onclick='showLessons()'>Continuar</button></div>`;return}let cur=qs[n], pool=[cur[1],...lessons[i][1].filter(x=>x!==cur).sort(()=>Math.random()-.5).slice(0,2).map(x=>x[1])].sort(()=>Math.random()-.5);let h=`<div class='card'><button class='secondary back' onclick='openLesson(${i})'>← Aula</button><p>Questão ${n+1}/${qs.length}</p><h2>${cur[0]}</h2><p>Qual é a tradução?</p>`;pool.forEach(o=>h+=`<button class='quiz-option' onclick='answer(${JSON.stringify(o)},${JSON.stringify(cur[1])},${i})'>${o}</button>`);h+="</div>";document.getElementById("content").innerHTML=h;window._quiz={qs,n,score,render,i}}render()}
function answer(o,c,i){let ok=o===c;if(ok){window._quiz.score+=10;alert("✅ Correto! +10 pontos");}else alert("❌ Ainda não. A resposta correta é: "+c);window._quiz.n++;window._quiz.render()}
function startRandomQuiz(){let i=Math.floor(Math.random()*lessons.length);quiz(i)}
function showPhrases(){hideHome();let all=lessons.flatMap(x=>x[1]).slice(0,40);let h="<div class='card'><button class='secondary back' onclick='goHome()'>← Voltar</button><h2>🗣️ Frases úteis</h2>";all.forEach(x=>h+=`<div class='card'><div class='icelandic'>${x[0]}</div><div class='translation'>${x[1]}</div><button class='secondary' onclick='speak(${JSON.stringify(x[0])})'>🔊 Ouvir</button></div>`);h+="</div>";document.getElementById("content").innerHTML=h}
function showProgress(){hideHome();let level=state.points<100?"Iniciante":state.points<250?"Básico":state.points<500?"Intermediário":"Avançado";document.getElementById("content").innerHTML=`<div class='card'><button class='secondary back' onclick='goHome()'>← Voltar</button><h2>⭐ Meu progresso</h2><p><b>${state.points}</b> pontos</p><p>Nível: <b>${level}</b></p><p>Aulas concluídas: <b>${state.completed.length}/10</b></p><div class='progress'><div style='width:${state.completed.length*10}%'></div></div><hr><p class='small'>O progresso fica guardado neste dispositivo.</p><button class='red' onclick='resetProgress()'>Apagar progresso</button></div>`}
function resetProgress(){if(confirm("Apagar todo o progresso?")){state={points:0,completed:[],seen:0};save();showProgress()}}
update();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body></html>
